services:
  web:
    profiles: ["prod"]
    image: aimeric/axum-demo:0.0.1
    # image: axum-demo
    # build: 
    #   dockerfile: Dockerfile.dev
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/health/live || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - 8080:8080
    environment:
      SERVICE_DB_HOST: db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    profiles: ["dev"]
    image: postgres:17.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
    ports:
      - 5432:5432
    environment:
      PGUSER: "postgres"
      POSTGRES_PASSWORD: "welcome"
      POSTGRES_DB: "app_db"
    volumes:
      - ./infrastructure/docker-compose/postgres:/docker-entrypoint-initdb.d:ro

  otel-collector:
    profiles: ["dev"]
    image: otel/opentelemetry-collector-contrib:0.123.0
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:13133 || exit 1" ]
    volumes:
      - ./infrastructure/docker-compose/otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # Monitor Docker metrics
      # - /proc:/hostfs/proc # Monitor System metrics (Linux Only)
    ports:
      - 4317:4317 
      - 8888:8888 
      - 13133:13133

  prometheus:
    profiles: ["dev"]
    image: prom/prometheus:v3.3.0
    user: root 
    ports:
      - 9090:9090
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=3d"
      - "--web.enable-otlp-receiver"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=native-histograms"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./infrastructure/docker-compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus/data

  loki:
    profiles: ["dev"]
    image: grafana/loki:3.5
    user: root
    ports:
      - 3100:3100
    volumes:
      - ./infrastructure/docker-compose/loki/loki.yaml:/etc/loki/local-config.yaml
      - loki-data:/tmp/loki
    
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]

  postgres-exporter:
    profiles: ["dev"]
    image: prometheuscommunity/postgres-exporter:v0.17.0
    ports:
      - 9187:9187
    environment:
      - DATA_SOURCE_URI="db:5432/postgres?sslmode=disable" 
      - DATA_SOURCE_USER=postgres_exporter 
      - DATA_SOURCE_PASS=password

  grafana:
    profiles: ["dev"]
    image: grafana/grafana:11.6.1
    ports:
      - 3000:3000
    environment:
      GF_USERS_DEFAULT_THEME: "light"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_BASIC_ENABLED: "false"
    volumes:
      - ./infrastructure/docker-compose/grafana:/etc/grafana:ro
      - grafana-data:/var/lib/grafana

  tempo:
    profiles: ["dev"]
    image: grafana/tempo:2.7.2
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./infrastructure/docker-compose/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    logging:
      driver: loki
      options: 
        loki-url: "http://loki:3100/api/v1/push"
        loki-batch-size: "400"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1" ]
    ports:
      - 3200:3200

  minio:
    profiles: ["dev"]
    image: minio/minio:latest
    ports:
      - 9001:9001
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio-data:/data
    entrypoint: /bin/sh -c "
      mc mb --ignore-existing /data/tempo; 
      mc mb --ignore-existing /data/loki;
      minio server --console-address :9001 /data
      "
   
  k6:
    profiles: ["load-test"]
    image: grafana/k6:0.58.0
    volumes:
      - ./infrastructure/docker-compose/k6:/home/k6
    user: root
    entrypoint: /bin/sh -c "
      apk add uuidgen;
      TEST_ID="testid=$(uuidgen | cut -d"-" -f1)";
      k6 run --tag "$TEST_ID" -o experimental-prometheus-rw script.js
      "
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: true

  # proxy: 
  #   profiles: ["dev", "proxy"]
  #   image: traefik:v3.3
  #   healthcheck:
  #     test: [ "CMD-SHELL", "traefik healthcheck || exit 1" ]
  #   ports:
  #     - 80:80
  #     - 443:443
  #     - 8080:8080
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - ./infrastructure/docker-compose/traefik/traefik.yaml:/etc/traefik/traefik.yaml
  #     - ~/dev-ssl:/certs:ro

volumes:
  grafana-data:
  prometheus-data:
  tempo-data:
  loki-data:
  minio-data:

