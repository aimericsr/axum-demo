loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2025-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  querier:
    max_concurrent: 4
  ingester:
    chunk_encoding: snappy
  # compactor:
  #   retention_enabled: true
  #   delete_request_store: s3
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 48h
    max_query_lookback : 48h
 
  storage: 
    type: s3
    bucketNames:
      chunks: loki
    s3:       
      region: eu-paris-1
      endpoint: ax70azibgchm.compat.objectstorage.eu-paris-1.oraclecloud.com
      accessKeyId: b
      secretAccessKey: a
      insecure: false
      s3ForcePathStyle: true

deploymentMode: Distributed

monitoring: 
  serviceMonitor:
    enabled: true
    labels: 
      release: prometheus
    interval: 1m

# Write Path (Adding PVC to avoid data lose)
distributor:
  replicas: 1

ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  persistence:
    enabled: true
    inMemory: false
    claims:
      - name: data
        size: 5Gi
        storageClass: local-path
    enableStatefulSetAutoDeletePVC: false

indexGateway:
  replicas: 1
  persistence:
    enabled: true
    inMemory: false
    claims:
      - name: data
        size: 5Gi
        storageClass: local-path
    enableStatefulSetAutoDeletePVC: false

compactor:
  replicas: 1
  persistence:
    enabled: true
    inMemory: false
    claims:
      - name: data
        size: 5Gi
        storageClass: local-path
    enableStatefulSetAutoDeletePVC: false

# Read Path
queryFrontend:
  replicas: 1

queryScheduler:
  replicas: 1

querier:
  replicas: 1

test:
  enabled: false
lokiCanary:
  enabled: false

chunksCache:
  enabled: false

# Zero out other deployments mode
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

singleBinary:
  replicas: 0