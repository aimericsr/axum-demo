receivers:
  otlp:
    protocols:
      grpc:
        endpoint: otel-collector:4317
  docker_stats:
  hostmetrics:
    collection_interval: 10s
    # root_path: /hostfs
    scrapers:
      cpu:
      disk:
      load:
      filesystem:
      memory:
      network:
      paging:
      processes:
      process:
      system:
  postgresql:
    endpoint: db:5432
    username: monitoring_user
    password: secure_password
    databases:
    - app_db
    collection_interval: 30s
    tls:
      insecure: true
  prometheus:
    config:
      scrape_configs:
      - job_name: 'otel-collector'
        scrape_interval: 30s
        static_configs:
        - targets: [ 'localhost:8888' ]

processors:
  resourcedetection/env:
    detectors: [ env ]
    timeout: 2s
    override: false
  resourcedetection/system:
    detectors: [ "system" ]
    system:
      hostname_sources: [ "dns", "os" ]
  resourcedetection/docker:
    detectors: [ env, docker ]
    timeout: 2s
    override: false
  batch:
    timeout: 5s

exporters:
  debug:
    verbosity: detailed
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    tls:
      insecure: true

extensions:
  health_check:
  pprof:
  zpages:


service:
  extensions: [ health_check, pprof, zpages ]
  pipelines:
    metrics:
      receivers: [ otlp, postgresql, prometheus ]
      processors: [ resourcedetection/docker, resourcedetection/system, batch ]
      exporters: [ prometheusremotewrite ]
    traces:
      receivers: [ otlp ]
      processors: [ resourcedetection/docker, resourcedetection/system, batch ]
      exporters: [ otlp/tempo ]